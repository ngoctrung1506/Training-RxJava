apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

android {
    namespace 'gooner.demo.tranning_rxandroid'
    compileSdk 34

    defaultConfig {
        applicationId "gooner.demo.tranning_rxandroid"
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

ext {
    lib_versions = [
            rx_java      : "2.2.8",
            rx_android   : "2.1.1",
            rx_kotlin    : "2.1.0",
            recycler_view: "1.3.2",
            coroutines   : "1.8.1",
            compose_bom  : "2024.06.00",
            activity     : "1.9.0",
            lifecycle    : "2.8.2"
    ]
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation "androidx.recyclerview:recyclerview:$lib_versions.recycler_view"

    // Coroutines: everything the photo editor does off the main thread
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$lib_versions.coroutines"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$lib_versions.coroutines"

    // Jetpack Compose: the photo editor UI
    implementation platform("androidx.compose:compose-bom:$lib_versions.compose_bom")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation "androidx.activity:activity-compose:$lib_versions.activity"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lib_versions.lifecycle"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lib_versions.lifecycle"
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // RxJava, still used by the operator training samples
    implementation "io.reactivex.rxjava2:rxjava:$lib_versions.rx_java"
    // RxKotlin
    implementation "io.reactivex.rxjava2:rxkotlin:$lib_versions.rx_kotlin"
    // RxAndroid
    implementation "io.reactivex.rxjava2:rxandroid:$lib_versions.rx_android"
}
